[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=debug
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
command=redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/redis.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/var/log/supervisor/redis.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=redis
priority=10

[program:sentinel]
command=redis-sentinel /etc/redis/sentinel.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sentinel.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/var/log/supervisor/sentinel.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=redis
priority=20

[program:updater]
command=/bin/bash -c "sleep 15 && exec /app/flux-agent daemon"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/updater.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/var/log/supervisor/updater.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
priority=30

[program:proxy]
command=/bin/bash -c "sleep 10 && exec /app/flux-agent proxy"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/proxy.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile=/var/log/supervisor/proxy.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
user=root
priority=40
